<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif" font-size="14" viewBox="0 0 960 640"><rect width="960" height="640" fill="#0d1117"/><text x="480" y="30" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">dsh-voice-mode (fork) — 语音双工数据流</text><rect width="200" height="64" x="30" y="60" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="10"/><text x="130" y="86" fill="#58a6ff" font-weight="700" text-anchor="middle">麦克风 Mic</text><text x="130" y="108" fill="#8b949e" font-size="12" text-anchor="middle">16kHz 单声道 · AEC 回声消除</text><rect width="200" height="76" x="30" y="150" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="10"/><text x="130" y="178" fill="#58a6ff" font-weight="700" text-anchor="middle">浏览器 VAD 分段</text><text x="130" y="198" fill="#8b949e" font-size="12" text-anchor="middle">静音 5s 断句 / 按住说门控</text><text x="130" y="216" fill="#8b949e" font-size="12" text-anchor="middle">增量传输（每 0.9s 只传新增）</text><rect width="200" height="64" x="30" y="280" fill="#161b22" stroke="#3fb950" stroke-width="1.5" rx="10"/><text x="130" y="306" fill="#3fb950" font-weight="700" text-anchor="middle">草稿 → 自动发送</text><text x="130" y="328" fill="#8b949e" font-size="12" text-anchor="middle">autoSend / 按住说松手发送</text><rect width="200" height="76" x="30" y="410" fill="#161b22" stroke="#3fb950" stroke-width="1.5" rx="10"/><text x="130" y="438" fill="#3fb950" font-weight="700" text-anchor="middle">播放 + 字幕浮层</text><text x="130" y="458" fill="#8b949e" font-size="12" text-anchor="middle">SSE 音频帧（WAV/MP3）</text><text x="130" y="476" fill="#8b949e" font-size="12" text-anchor="middle">逐段顺序 · 世代链防重播</text><rect width="290" height="64" x="330" y="60" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" rx="10"/><text x="475" y="86" fill="#58a6ff" font-weight="700" text-anchor="middle">paraformer 双语流式识别</text><text x="475" y="108" fill="#8b949e" font-size="12" text-anchor="middle">host 本地 WASM · 懒下载 · SHA256 校验</text><rect width="290" height="56" x="330" y="150" fill="#161b22" stroke="#d29922" stroke-width="1.5" rx="10"/><text x="475" y="173" fill="#d29922" font-weight="700" text-anchor="middle">神经标点（ct-transformer）</text><text x="475" y="193" fill="#8b949e" font-size="12" text-anchor="middle">定稿自动补 ，。？！ · 失败回退原文</text><rect width="290" height="64" x="330" y="232" fill="#161b22" stroke="#a371f7" stroke-width="1.5" rx="10"/><text x="475" y="258" fill="#a371f7" font-weight="700" text-anchor="middle">llm/stream 无损 tap → 分句</text><text x="475" y="280" fill="#8b949e" font-size="12" text-anchor="middle">text-delta 过滤 · markdown 剥离消毒</text><rect width="290" height="64" x="330" y="322" fill="#161b22" stroke="#a371f7" stroke-width="1.5" rx="10"/><text x="475" y="348" fill="#a371f7" font-weight="700" text-anchor="middle">TTS 队列（epoch 打断）</text><text x="475" y="370" fill="#8b949e" font-size="12" text-anchor="middle">打断即杀在途合成 · 积压作废</text><rect width="290" height="96" x="330" y="412" fill="#161b22" stroke="#3fb950" stroke-width="1.5" rx="10"/><text x="475" y="438" fill="#3fb950" font-weight="700" text-anchor="middle">本地 TTS 引擎（子进程 fork）</text><text x="475" y="460" fill="#8b949e" font-size="12" text-anchor="middle">VITS 纯中文（WASM）</text><text x="475" y="478" fill="#8b949e" font-size="12" text-anchor="middle">Kokoro 中英（sherpa-onnx-node 原生，2 线程）</text><text x="475" y="496" fill="#8b949e" font-size="12" text-anchor="middle">Edge 云端（可选） · 103 音色</text><rect width="240" height="200" x="690" y="60" fill="#161b22" stroke="#30363d" stroke-width="1" rx="10"/><text x="810" y="88" fill="#e6edf3" font-weight="700" text-anchor="middle">安全面（四层）</text><text x="710" y="116" fill="#8b949e" font-size="12">① 会话存在性校验</text><text x="710" y="136" fill="#8b949e" font-size="12">② 回环默认 + Origin 校验</text><text x="710" y="156" fill="#8b949e" font-size="12">③ 全端点限流</text><text x="710" y="176" fill="#8b949e" font-size="12">④ 模型 SHA256 + 域名白名单</text><text x="710" y="208" fill="#8b949e" font-size="12">打断：自适应阈值 + 二级</text><text x="710" y="228" fi