<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" aria-labelledby="title desc" role="img" viewBox="0 0 1200 640"><title id="title">dsh-voice-mode 原理架构图</title><desc id="desc">展示语音输入、模型输出朗读与开口打断三条数据流，以及全局单活指针的会话隔离。</desc><defs><marker id="arrow" markerHeight="8" markerUnits="strokeWidth" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#66737f" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="arrowGreen" markerHeight="8" markerUnits="strokeWidth" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#2ea043" d="M0,0 L8,4 L0,8 Z"/></marker><style>text{fill:#333;font-family:&quot;Noto Sans SC&quot;,&quot;Microsoft YaHei&quot;,Arial,sans-serif}.title{font-size:25px;font-weight:700}.subtitle{font-size:12px;fill:#66737f}.lane{fill:#faf9f5;stroke:#dedbd2;stroke-width:1.2}.lane-blue,.lane-green{fill:#f5f8fa;stroke:#d7e0e6;stroke-width:1.2}.lane-green{fill:#f6faf6;stroke:#cfe4d3}.lane-title{font-size:17px;font-weight:700}.lane-no{font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#fff}.node,.node-blue{fill:#fffdf7;stroke:#b8b4a8;stroke-width:1.4;rx:10}.node-blue{fill:#eef4f7;stroke:#9fb3bf}.node-green{fill:#eff8f0;stroke:#2ea043;stroke-width:1.7;rx:10}.node-title{font-size:13px;font-weight:700;text-anchor:middle}.node-detail{font-size:10.5px;fill:#59636c;text-anchor:middle}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,&quot;Liberation Mono&quot;,monospace}.flow{fill:none;stroke:#66737f;stroke-width:1.8;marker-end:url(#arrow)}.flow-green{fill:none;stroke:#2ea043;stroke-width:2;marker-end:url(#arrowGreen)}.label-bg{fill:#fff;stroke:#d8dde1;stroke-width:.8;rx:7}.label{font-size:9.5px;fill:#59636c;text-anchor:middle}.note{fill:#eff8f0;stroke:#2ea043;stroke-width:1.3;rx:10}.note-title{font-size:12px;font-weight:700;fill:#237a34}.note-text{font-size:10.5px;fill:#46534a}.dash{fill:none;stroke:#2ea043;stroke-width:1.2;stroke-dasharray:4 4}</style></defs><rect width="1200" height="640" fill="#fff"/><text x="32" y="38" class="title">dsh-voice-mode 原理架构</text><text x="32" y="58" class="subtitle">浏览器采集与播放 · 宿主端 ASR / TTS · 无损模型流旁路</text><text x="32" y="75" class="note-text">全局单活指针 activeVoiceSession：同一时刻仅一个会话处于语音模式；普通会话 llm/stream 直达、零开销</text><rect width="400" height="51" x="768" y="16" class="note"/><text x="785" y="36" class="note-title">全局单活指针 <tspan class="mono">activeVoiceSession</tspan></text><text x="785" y="54" class="note-text">仅指定会话进入语音旁路；普通会话 <tspan class="mono">llm/stream</tspan> 零开销直达</text><rect width="1160" height="178" x="20" y="82" class="lane" rx="14"/><circle cx="47" cy="108" r="14" fill="#2ea043"/><text x="47" y="112" class="lane-no" text-anchor="middle">01</text><text x="70" y="114" class="lane-title">输入链路 · 采集、断句与识别</text><rect width="155" height="82" x="40" y="137" class="node"/><text x="117.5" y="162" class="node-title">浏览器麦克风</text><text x="117.5" y="181" class="node-detail mono">getUserMedia · 16k mono</text><text x="117.5" y="198" class="node-detail mono">echoCancellation</text><rect width="175" height="82" x="225" y="137" class="node-blue"/><text x="312.5" y="160" class="node-title">RMS VAD</text><text x="312.5" y="179" class="node-detail">持续聆听 · VAD 自动断句 ·</text><text x="312.5" y="197" class="node-detail"><tspan class="mono">hold</tspan> 模式按住说话绕过 VAD</text><rect width="205" height="102" x="430" y="127" class="node-blue"/><text x="532.5" y="151" class="node-title mono">POST /voice-mode/asr</text><text x="532.5" y="170" class="node-detail mono">f32 LE PCM</text><text x="532.5" y="188" class="node-detail">宿主 sherpa-onnx Node WASM</text><text x="532.5" y="206" class="node-detail mono">zipformer2 · 流式识别</text><text x="532.5" y="220" class="node-detail">模型懒下载 160MB · <tspan class="mono">.part</tspan> 续传</text><rect width="145" height="82" x="665" y="137" class="node"/><text x="737.5" y="162" class="node-title">识别结果</text><text x="737.5" y="181" class="node-detail"><tspan class="mono">partial</tspan> 预览字幕</text><text x="737.5" y="198" class="node-detail">定稿</text><rect width="135" height="82" x="840" y="137" class="node"/><text x="907.5" y="167" class="node-title">composer 草稿</text><text x="907.5" y="189" class="node-detail">写入输入框</text><rect width="145" height="82" x="1005" y="137" class="node-green"/><text x="1077.5" y="160" class="node-title">自动发送</text><text x="1077.5" y="179" class="node-detail mono">autoSend</text><text x="1077.5" y="197" class="node-detail"><tspan class="mono">Ctrl</tspan> / <tspan class="mono">hold</tspan> 松手强制</text><path d="M195 178 H225" class="flow"/><path d="M400 178 H430" class="flow"/><path d="M635 178 H665" class="flow"/><path d="M810 178 H840" class="flow"/><path d="M975 178 H1005" class="flow-green"/><rect width="24" height="16" x="198" y="151" class="label-bg"/><text x="210" y="162" class="label">PCM</text><rect width="26" height="16" x="402" y="151" class="label-bg"/><text x="415" y="162" class="label">POST</text><rect width="24" height="16" x="638" y="151" class="label-bg"/><text x="650" y="162" class="label">增量</text><rect width="26" height="16" x="812" y="151" class="label-bg"/><text x="825" y="162" class="label">定稿</text><rect width="26" height="16" x="977" y="151" class="label-bg"/><text x="990" y="162" class="label">发送</text><rect width="1160" height="178" x="20" y="276" class="lane-blue" rx="14"/><circle cx="47" cy="302" r="14" fill="#2ea043"/><text x="47" y="306" class="lane-no" text-anchor="middle">02</text><text x="70" y="308" class="lane-title">输出链路 · 无损旁路、逐句合成与播放</text><rect width="135" height="76" x="40" y="337" class="node"/><text x="107.5" y="365" class="node-title">model stream</text><text x="107.5" y="386" class="node-detail">模型原始输出</text><rect width="155" height="96" x="205" y="327" class="node-green"/><text x="282.5" y="351" class="node-title mono">llm/stream tap</text><text x="282.5" y="371" class="node-detail">chunk 原样透传</text><text x="282.5" y="389" class="node-detail">仅单活语音会话旁观</text><text x="282.5" y="406" class="node-detail">不阻塞模型流</text><rect width="135" height="76" x="390" y="337" class="node-blue"/><text x="457.5" y="365" class="node-title mono">text-delta</text><text x="457.5" y="386" class="node-detail">过滤文本增量</text><rect width="155" height="76" x="555" y="337" class="node-blue"/><text x="632.5" y="361" class="node-title mono">SentenceSegmenter</text><text x="632.5" y="384" class="node-detail">中文标点切句</text><rect width="155" height="96" x="740" y="327" class="node-blue"/><text x="817.5" y="351" class="node-title mono">TtsQueue</text><text x="817.5" y="371" class="node-detail"><tspan class="mono">msedge-tts</tspan> 逐句合成</text><text x="817.5" y="390" class="node-detail"><tspan class="mono">epoch</tspan> 版本化</text><text x="817.5" y="407" class="node-detail">按会话隔离</text><rect width="205" height="96" x="925" y="327" class="node-blue"/><text x="1027.5" y="351" class="node-title mono">SSE /voice-mode/stream</text><text x="1027.5" y="372" class="node-detail mono">event: audio</text><text x="1027.5" y="390" class="node-detail mono">{ text, base64 MP3 }</text><text x="1027.5" y="407" class="node-detail">浏览器播放 + 右下角字幕浮层</text><path d="M175 375 H205" class="flow"/><path d="M360 375 H390" class="flow"/><path d="M525 375 H555" class="flow"/><path d="M710 375 H740" class="flow"/><path d="M895 375 H925" class="flow-green"/><rect width="26" height="16" x="177" y="348" class="label-bg"/><text x="190" y="359" class="label">无损</text><rect width="26" height="16" x="362" y="348" class="label-bg"/><text x="375" y="359" class="label">旁观</text><rect width="26" height="16" x="527" y="348" class="label-bg"/><text x="540" y="359" class="label">增量</text><rect width="26" height="16" x="712" y="348" class="label-bg"/><text x="725" y="359" class="label">逐句</text><rect width="26" height="16" x="897" y="348" class="label-bg"/><text x="910" y="359" class="label">音频</text><path d="M900 67 V92 H282 V327" class="dash"/><rect width="1160" height="150" x="20" y="470" class="lane-green" rx="14"/><circle cx="47" cy="496" r="14" fill="#2ea043"/><text x="47" y="500" class="lane-no" text-anchor="middle">03</text><text x="70" y="502" class="lane-title">打断 <tspan class="mono">barge-in</tspan> · 即刻静音并取消当前回合</text><rect width="235" height="67" x="60" y="529" class="node-green"/><text x="177.5" y="553" class="node-title">开口说话</text><text x="177.5" y="574" class="node-detail">高门槛能量 + 持续时长 · 三档灵敏度</text><rect width="180" height="67" x="355" y="529" class="node"/><text x="445" y="553" class="node-title">本地播放静音</text><text x="445" y="574" class="node-detail">浏览器立即停止旧音频</text><rect width="245" height="87" x="595" y="519" class="node-green"/><text x="717.5" y="543" class="node-title mono">POST /voice-mode/cancel</text><text x="717.5" y="565" class="node-detail mono">TTS epoch++</text><text x="717.5" y="584" class="node-detail">作废队列与在途句</text><rect width="240" height="87" x="900" y="519" class="node-blue"/><text x="1020" y="546" class="node-title mono">session.cancel(keepInbox)</text><text x="1020" y="568" class="node-detail">取消运行中回合</text><text x="1020" y="586" class="node-detail">保留新消息</text><path d="M295 562 H355" class="flow-green"/><path d="M535 562 H595" class="flow-green"/><path d="M840 562 H900" class="flow-green"/><rect width="36" height="16" x="307" y="535" class="label-bg"/><text x="325" y="546" class="label">触发</text><rect width="36" height="16" x="547" y="535" class="label-bg"/><text x="565" y="546" class="label">同时</text><rect width="36" height="16" x="852" y="535" class="label-bg"/><text x="870" y="546" class="label">取消</text></svg>