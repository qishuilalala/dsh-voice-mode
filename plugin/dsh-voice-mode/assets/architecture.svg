<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, system-ui, sans-serif" font-size="14">
  <rect width="960" height="640" fill="#0d1117"/>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">dsh-voice-mode (fork) — 语音双工数据流</text>

  <!-- 浏览器侧 -->
  <rect x="30" y="60" width="200" height="64" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="130" y="86" text-anchor="middle" fill="#58a6ff" font-weight="700">麦克风 Mic</text>
  <text x="130" y="108" text-anchor="middle" fill="#8b949e" font-size="12">16kHz 单声道 · AEC 回声消除</text>

  <rect x="30" y="150" width="200" height="76" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="130" y="178" text-anchor="middle" fill="#58a6ff" font-weight="700">浏览器 VAD 分段</text>
  <text x="130" y="198" text-anchor="middle" fill="#8b949e" font-size="12">静音 5s 断句 / 按住说门控</text>
  <text x="130" y="216" text-anchor="middle" fill="#8b949e" font-size="12">增量传输（每 0.9s 只传新增）</text>

  <rect x="30" y="280" width="200" height="64" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="130" y="306" text-anchor="middle" fill="#3fb950" font-weight="700">草稿 → 自动发送</text>
  <text x="130" y="328" text-anchor="middle" fill="#8b949e" font-size="12">autoSend / 按住说松手发送</text>

  <rect x="30" y="410" width="200" height="76" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="130" y="438" text-anchor="middle" fill="#3fb950" font-weight="700">播放 + 字幕浮层</text>
  <text x="130" y="458" text-anchor="middle" fill="#8b949e" font-size="12">SSE 音频帧（WAV/MP3）</text>
  <text x="130" y="476" text-anchor="middle" fill="#8b949e" font-size="12">逐段顺序 · 世代链防重播</text>

  <!-- Host 侧 -->
  <rect x="330" y="60" width="290" height="64" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="475" y="86" text-anchor="middle" fill="#58a6ff" font-weight="700">paraformer 双语流式识别</text>
  <text x="475" y="108" text-anchor="middle" fill="#8b949e" font-size="12">host 本地 WASM · 懒下载 · SHA256 校验</text>

  <rect x="330" y="150" width="290" height="56" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="475" y="173" text-anchor="middle" fill="#d29922" font-weight="700">神经标点（ct-transformer）</text>
  <text x="475" y="193" text-anchor="middle" fill="#8b949e" font-size="12">定稿自动补 ，。？！ · 失败回退原文</text>

  <rect x="330" y="232" width="290" height="64" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="475" y="258" text-anchor="middle" fill="#a371f7" font-weight="700">llm/stream 无损 tap → 分句</text>
  <text x="475" y="280" text-anchor="middle" fill="#8b949e" font-size="12">text-delta 过滤 · markdown 剥离消毒</text>

  <rect x="330" y="322" width="290" height="64" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="475" y="348" text-anchor="middle" fill="#a371f7" font-weight="700">TTS 队列（epoch 打断）</text>
  <text x="475" y="370" text-anchor="middle" fill="#8b949e" font-size="12">打断即杀在途合成 · 积压作废</text>

  <rect x="330" y="412" width="290" height="96" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="475" y="438" text-anchor="middle" fill="#3fb950" font-weight="700">本地 TTS 引擎（子进程 fork）</text>
  <text x="475" y="460" text-anchor="middle" fill="#8b949e" font-size="12">VITS 纯中文（WASM）</text>
  <text x="475" y="478" text-anchor="middle" fill="#8b949e" font-size="12">Kokoro 中英（sherpa-onnx-node 原生，2 线程）</text>
  <text x="475" y="496" text-anchor="middle" fill="#8b949e" font-size="12">Edge 云端（可选） · 103 音色</text>

  <!-- 右侧说明 -->
  <rect x="690" y="60" width="240" height="200" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="810" y="88" text-anchor="middle" fill="#e6edf3" font-weight="700">安全面（四层）</text>
  <text x="710" y="116" fill="#8b949e" font-size="12">① 会话存在性校验</text>
  <text x="710" y="136" fill="#8b949e" font-size="12">② 回环默认 + Origin 校验</text>
  <text x="710" y="156" fill="#8b949e" font-size="12">③ 全端点限流</text>
  <text x="710" y="176" fill="#8b949e" font-size="12">④ 模型 SHA256 + 域名白名单</text>
  <text x="710" y="208" fill="#8b949e" font-size="12">打断：自适应阈值 + 二级</text>
  <text x="710" y="228" fill="#8b949e" font-size="12">空闲：听与说同权</text>
  <text x="710" y="248" fill="#8b949e" font-size="12">模式：持续聆听 ⇄ 按住说</text>

  <!-- 箭头 -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#f85149"/>
    </marker>
  </defs>
  <line x1="230" y1="92" x2="326" y2="92" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="230" y1="188" x2="326" y2="178" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="475" y1="124" x2="475" y2="146" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="230" y1="312" x2="326" y2="264" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="475" y1="296" x2="475" y2="318" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="475" y1="386" x2="475" y2="408" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="620" y1="460" x2="720" y2="460" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="720" y1="460" x2="720" y2="446" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="130" y1="410" x2="130" y2="348" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="330" y1="348" x2="234" y2="348" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="234" y1="348" x2="234" y2="406" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- 打断回路 -->
  <line x1="130" y1="486" x2="130" y2="560" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="300" y="556" fill="#f85149" font-size="12">说话打断：本地静音 + 队列作废 + 回合取消（二级 1.5s）</text>
</svg>
