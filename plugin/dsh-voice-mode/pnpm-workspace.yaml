  - '@deepseek-ai/cordis@4.0.4'
  - '@deepseek-ai/cosmokit@1.8.5'
  - '@deepseek-ai/schemastery@3.18.4'
  - '@deepseek-ai/cordis-plugin-group@1.0.4'
  - '@deepseek-ai/dsh-app-boot@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-atomic-write@0.1.7-alpha.2 || 0.1.7-rc.1'
  - '@deepseek-ai/dsh-config-editor@0.1.7-alpha.2 || 0.1.7-rc.1'
