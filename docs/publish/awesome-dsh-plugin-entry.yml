url: https://github.com/qishuilalala/dsh-voice-mode
name: qishuilalala/dsh-voice-mode
category: voice
description:
  en: 'Full-duplex voice mode for the Web UI: session-level mic toggle (button or `Ctrl+Shift+V`) with zipformer2 streaming ASR into an editable draft, 2-second silence auto-send (or hold `Ctrl`), sentence-by-sentence Edge TTS read-aloud with a live caption, and speaking interrupts playback and the running turn (true barge-in). No API key.'
  zh: 'Web UI 全双工语音对话：会话内开启（按钮或 `Ctrl+Shift+V`），zipformer2 流式识别入可编辑草稿，停顿 2 秒自动发送（或按住 `Ctrl`），最终答复按句流式 Edge TTS 朗读并显示实时字幕，开口即打断播放与正在运行的回合（真 barge-in），无需 API key。'
