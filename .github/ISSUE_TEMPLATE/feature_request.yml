name: Feature request
description: 提出功能建议（新语音能力 / 设置项 / 体验改进）
title: "[feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 说明你想要的能力与使用场景，便于评估实现路径。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在的痛点或缺失的能力
      placeholder: "在使用语音模式时，我希望……"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的形态
      description: 交互、配置或 API 上的设想
      placeholder: "例如新增设置项 xxx，默认值……"
  - type: checkboxes
    id: willingness
    attributes:
      label: 参与方式
      options:
        - label: 我可以提供实现（PR）
        - label: 我可以帮忙测试
        - label: 仅反馈需求
