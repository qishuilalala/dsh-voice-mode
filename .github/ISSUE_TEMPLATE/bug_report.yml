name: 缺陷报告 / Bug report
description: 报告语音模式的问题（识别、朗读、打断、快捷键、字幕、设置等）/ Report a bug in voice mode
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！语音问题通常与运行环境（桌面端或浏览器、麦克风权限、扬声器外放/耳机、所选朗读引擎）直接相关，填写下方信息有助于快速复现和定位。
        请勿粘贴任何真实 API Key、访问令牌或私人对话敏感内容。

  - type: textarea
    id: what-happened
    attributes:
      label: 现象与期望结果 / What happened & expected behavior
      description: 实际发生了什么？你期望的正常表现是什么？
      placeholder: 例如：切换到「按住说话」模式后，长按键盘快捷键没有开始收音；或朗读到第二句中断无声。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 请尽量写明交互模式、朗读引擎及具体操作顺序
      placeholder: |
        1. 打开会话并进入语音模式
        2. 交互模式选择「…」，朗读引擎选择「…」
        3. 执行「…」后观察到「…」
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本 / Plugin version
      description: 在宿主的已安装插件详情查看。源码安装请填写下方诊断信息里的构建哈希。 / Check the installed plugin details. For a source install, use the build hash from the diagnostics below.
      placeholder: "0.7.44"
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness 版本 / dsh version
      description: "`dsh --version` 或桌面端「关于」页面显示的版本号"
      placeholder: "0.2.2-rc.5"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统 / OS
      options:
        - macOS (Apple Silicon / Intel)
        - Windows (x64 / ARM64)
        - Linux
        - iOS / iPadOS
        - Android
        - 其他（请在补充信息注明）
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: 客户端形态 / Client environment
      options:
        - DeepSeek Harness 官方桌面端 (Electron)
        - Chrome / Edge (Chromium)
        - Safari (macOS)
        - Firefox
        - iOS Safari
        - 其他（请在补充信息注明）
    validations:
      required: true

  - type: dropdown
    id: audio-route
    attributes:
      label: 音频输出方式 / Audio output
      description: 发声打断与回声消除行为高度依赖此项
      options:
        - 扬声器外放 / Loudspeakers
        - 有线或蓝牙耳机 / Headphones
        - 不确定 / Unknown
    validations:
      required: true

  - type: dropdown
    id: interaction-mode
    attributes:
      label: 交互模式 / Interaction mode
      options:
        - toggle（持续聆听）
        - hold（按住说话）
        - once（说完就关）
        - 未进入语音模式（如总是朗读 / 设置面板）
    validations:
      required: true

  - type: dropdown
    id: tts-engine
    attributes:
      label: 朗读引擎 / TTS engine
      options:
        - edge（微软在线默认）
        - openai（OpenAI 兼容预设或自定义端点）
        - mimo（小米 MiMo）
        - vits（本地离线中文）
        - kokoro（本地离线中英）
        - off（关闭朗读 / 只听写）
        - 不确定 / Unknown
    validations:
      required: true

  - type: textarea
    id: telemetry
    attributes:
      label: 诊断快照或控制台日志（推荐）/ Diagnostics (optional)
      description: |
        在复现问题的会话中进入语音模式，点击输入框上方状态条的 **「复制诊断」** 后粘贴到此处。若状态条已隐藏，在 **设置 → 语音模式 → 显示与交互** 中打开状态条。快照包含构建哈希、运行状态、部分设置与可用的阶段耗时。

        In the affected conversation, enter Voice Mode and click **Copy diagnostics** in the status bar above the chat input. To show the bar, use **Settings → Voice Mode → Display & interaction**. Paste the snapshot here.

        如需详细阶段日志，可在浏览器控制台执行 `localStorage.setItem('dsh-voice-mode.telemetry','1')`，刷新后复现并粘贴 `[dsh-voice]` 开头的日志。提交前请检查并删除私人内容。
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional context
      description: 截图、错误提示文案或其他相关配置（如唤醒词、打断方式等）
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Pre-submission checklist
      options:
        - label: 我已搜索现有 Issue，确认不是重复报告 / I searched existing issues to avoid duplicates
          required: true
        - label: 我已确认提交内容不包含任何 API Key 或私人敏感信息 / No API keys or private data are included
          required: true
