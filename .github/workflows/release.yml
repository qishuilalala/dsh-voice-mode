name: Release

# 发版：推 tag `vX.Y.Z` → 校验版本一致 → pnpm 构建+测试 → npm publish（带 provenance）→ GitHub Release（正文取 CHANGELOG 对应段）。
# 前置：package.json version 与 CHANGELOG `## [X.Y.Z]` 段已提交到 main。
# npm 鉴权二选一：npmjs.com 上为本仓库配置 Trusted Publisher（workflow 填 release.yml，无需密钥），或仓库 secret NPM_TOKEN（Automation token）。
# 可重跑：npm 上已存在该版本则跳过 publish，Release 已存在则跳过创建。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已存在 tag（如 v0.7.26）'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: plugin/dsh-voice-mode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0  # check-build-tag 需要完整历史
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g pnpm@11

      - name: Check tag matches package.json and CHANGELOG
        run: |
          VER=$(node -p "require('./package.json').version")
          [ "v$VER" = "$TAG" ] || { echo "::error::tag $TAG != package.json v$VER"; exit 1; }
          grep -q "^## \[$VER\]" ../../CHANGELOG.md || { echo "::error::CHANGELOG.md 缺 ## [$VER] 段"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"

      # E-1：先于 build 校验——build 会把 lib 的 BUILD_TAG 改写成 tag 提交哈希，掩盖「tag 内入库 lib 落后」。
      - name: Check committed lib BUILD_TAG matches tagged source
        run: node scripts/check-build-tag.mjs
      - name: Check THIRD_PARTY_NOTICES versions match lockfile
        run: node scripts/check-notices-versions.mjs

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run check:anchors
      # 2026-10-22 补：文档锚点守卫（R15 新增的唯一机械门禁，ci.yml 已有）——发布动作本身也须过
      - run: pnpm run check:doc-anchors
      - run: pnpm run typecheck

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "dsh-voice-mode@$VER" version >/dev/null 2>&1; then
            echo "dsh-voice-mode@$VER 已在 npm，跳过"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过"
            exit 0
          fi
          awk -v v="$VER" '$0 ~ "^## \\[" { if (f) exit; if (index($0, "## [" v "]") == 1) f = 1; next } f' ../../CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --title "dsh-voice-mode $TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
