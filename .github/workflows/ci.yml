name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/dsh-voice-mode
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: plugin/dsh-voice-mode/pnpm-lock.yaml
      - name: Install
        run: pnpm install
      - name: Unit tests & manifest self-check
        run: pnpm test
      - name: Build
        run: pnpm build
