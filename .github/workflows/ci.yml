name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin/dsh-voice-mode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # tests import src/*.ts directly (Node type stripping ≥22.18); runtime engines stays >=18
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck (host + client)
        run: npm run typecheck
      - name: Unit tests & manifest self-check
        run: npm test
      - name: Build
        run: npm run build
