# Dependabot 配置（整仓）
#
# 覆盖两处 npm 依赖面：
#   "/"                     —— 仓库根 manifest（仅身份字段，无运行时依赖，供插件市场扫描识别）
#   "/plugin/dsh-voice-mode" —— 插件本体（实际发布到 npm 的包，依赖与内联第三方代码在此）
version: 2
updates:
  - package-ecosystem: npm
    directory: "/plugin/dsh-voice-mode"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
