# Dependabot 配置（整仓）
#
# npm 维护实际发布包；根 manifest 仅身份字段，无独立依赖。
# 同一锁文件的常规更新集中提交；原生运行时配对，构建器升级单独验收。
version: 2
updates:
  - package-ecosystem: npm
    directory: "/plugin/dsh-voice-mode"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      native-runtime:
        patterns: ["sherpa-onnx", "sherpa-onnx-node"]
      build-tool:
        patterns: ["esbuild"]
      maintenance:
        patterns: ["*"]
        exclude-patterns: ["sherpa-onnx", "sherpa-onnx-node", "esbuild"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
