<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="dsh-voice-mode banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#141a22"/>
      <stop offset="1" stop-color="#10231c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ea043" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="300" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="240" cy="300" r="230" fill="url(#glow)" opacity="0.45" filter="url(#soft)"/>

  <!-- 右区：声波波形（基线 y=252，向上生长） -->
  <g fill="url(#bar)" opacity="0.95" transform="translate(928,0)">
    <rect x="0"   y="170" width="18" height="82"  rx="9"/>
    <rect x="34"  y="136" width="18" height="116" rx="9"/>
    <rect x="68"  y="96"  width="18" height="156" rx="9"/>
    <rect x="102" y="150" width="18" height="102" rx="9"/>
    <rect x="136" y="56"  width="18" height="196" rx="9"/>
    <rect x="170" y="120" width="18" height="132" rx="9"/>
    <rect x="204" y="86"  width="18" height="166" rx="9"/>
    <rect x="238" y="142" width="18" height="110" rx="9"/>
  </g>

  <!-- 右区：麦克风 -->
  <g transform="translate(1210,116)" fill="none" stroke="#8b949e" stroke-width="10" stroke-linecap="round">
    <rect x="-60" y="-60" width="120" height="120" rx="30" fill="rgba(46,160,67,0.12)" stroke="none"/>
    <rect x="-17" y="-45" width="34" height="60" rx="17" fill="url(#bar)" stroke="none"/>
    <path d="M-34 -26a34 34 0 0 0 68 0" opacity="0.8"/>
    <path d="M0 -44v40" opacity="0"/>
    <path d="M-12 44h24" opacity="0"/>
  </g>

  <!-- 左区：标题 -->
  <text x="84" y="112" font-family="system-ui, sans-serif" font-size="18" fill="#3fb950" letter-spacing="4">
    SPEAK · LISTEN · INTERRUPT
  </text>
  <text x="80" y="168" font-family="'SF Mono','Fira Code',Consolas,monospace" font-size="64" font-weight="700" fill="#e6edf3" letter-spacing="1">
    dsh-voice-mode
  </text>
  <text x="84" y="214" font-family="system-ui, 'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#8b949e" letter-spacing="2">
    语音双工对话模式 · FULL-DUPLEX VOICE
  </text>

  <!-- 左下：小标签 -->
  <g transform="translate(84,248)" font-family="system-ui, sans-serif" font-size="15" fill="#58a6ff" letter-spacing="1">
    <rect x="0" y="-12" width="150" height="28" rx="14" fill="rgba(88,166,255,0.10)" stroke="rgba(88,166,255,0.35)" stroke-width="1.5"/>
    <text x="20" y="7">zipformer2 ASR</text>
  </g>
  <g transform="translate(250,248)" font-family="system-ui, sans-serif" font-size="15" fill="#3fb950" letter-spacing="1">
    <rect x="0" y="-12" width="126" height="28" rx="14" fill="rgba(63,185,80,0.10)" stroke="rgba(63,185,80,0.35)" stroke-width="1.5"/>
    <text x="20" y="7">Edge TTS</text>
  </g>
  <g transform="translate(392,248)" font-family="system-ui, sans-serif" font-size="15" fill="#e6edf3" letter-spacing="1">
    <rect x="0" y="-12" width="132" height="28" rx="14" fill="rgba(230,237,243,0.08)" stroke="rgba(230,237,243,0.30)" stroke-width="1.5"/>
    <text x="20" y="7">barge-in</text>
  </g>
</svg>
